# Inherits org-wide settings from https://github.com/openshift/coderabbit/blob/main/.coderabbit.yaml
# Based on AppSRE team pattern (observability-operator) + splunk-forwarder-operator baseline
---
inheritance: true
reviews:
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  sequence_diagrams: false
  collapse_walkthrough: true
  changed_files_summary: false
  poem: false
  path_filters:
    # Exclude build artifacts and dependencies
    - "!build/**"
    - "!.venv/**"

    # Exclude test fixtures
    - "!**/testdata/**"
    - "!**/.test-fixtures/**"
  path_instructions:
    - path: '**'
      instructions: >-
        Focus on major issues impacting performance, readability, maintainability and security.
        Avoid nitpicks and avoid verbosity.
  auto_review:
    ignore_title_keywords:
      - WIP
    labels:
      - '!work-in-progress'
knowledge_base:
  opt_out: true
  web_search:
    enabled: false
